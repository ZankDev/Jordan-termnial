<script>
const DATA = __DATA__;
const tl = gsap.timeline({ paused: true });
const draws = [];               // canvases redrawn after every seek
const root = document.getElementById("scenes");
const el = (html, parent) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const n = d.firstChild; (parent || root).appendChild(n); return n; };
const C = { up: "#f1f1f4", dn: "#ff8a1f", call: "#22c08f", put: "#ff4d5e", zero: "#ffa028", grid: "rgba(255,255,255,.06)" };

// ---------- chart engine: candles revealed by progress, levels, bubbles, boxes, arrows, all driven by tween-able state
function chart(sc, parent, spec) {

  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = spec.candles, n = cs.length, lo = spec.lo, hi = spec.hi, padL = 40, padR = 40;
  const st = { p: 0, shake: 0, levels: (spec.levels || []).map(() => 0), boxes: (spec.boxes || []).map(() => 0), bubbles: 0, arrows: (spec.arrows || []).map(() => 0), glow: 0, cam: 1 };
  const X = (i) => padL + ((i + 0.5) / n) * (W - padL - padR), Y = (v) => 40 + ((hi - v) / (hi - lo)) * (H - 80);

  function draw() {
    ctx.save(); ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    for (let k = 0; k <= 6; k++) { const y = 40 + k * (H - 80) / 6; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke(); }
    // levels
    (spec.levels || []).forEach((L, j) => {
      const a = st.levels[j]; if (a <= 0) return;
      const y = Y(L.v), x1 = padL + (W - padL - padR) * Math.min(1, a);
      ctx.save(); ctx.strokeStyle = L.color; ctx.lineWidth = 3; ctx.shadowColor = L.color; ctx.shadowBlur = 18; if (L.dash) ctx.setLineDash([14, 10]);

    });

    (spec.boxes || []).forEach((B, j) => {
      const a = st.boxes[j]; if (a <= 0) return;
      const x0 = X(B.i0) - cw, x1 = x0 + (X(B.i1) - x0) * Math.min(1, a), ye = Y(B.entry);
      ctx.save(); ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.fillStyle = "rgba(34,192,143,.22)"; ctx.fillRect(x0, Math.min(ye, Y(B.target)), x1 - x0, Math.abs(Y(B.target) - ye));
      ctx.fillStyle = "rgba(255,77,94,.22)"; ctx.fillRect(x0, Math.min(ye, Y(B.stop)), x1 - x0, Math.abs(Y(B.stop) - ye));
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, ye); ctx.lineTo(x1, ye); ctx.stroke();
      if (a > 0.7) { ctx.font = "800 22px Inter"; ctx.textBaseline = "middle"; const tag = (txt, y, bg) => { const tw = ctx.measureText(txt).width + 24; ctx.fillStyle = bg; roundRect(ctx, x1 - tw - 6, y - 17, tw, 34, 9); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText(txt, x1 - tw + 6, y); };
        tag(B.tTarget || "TARGET", Y(B.target) + (B.target > B.entry ? 22 : -22), "#16a37a"); tag(B.tStop || "STOP", Y(B.stop) + (B.stop < B.entry ? -22 : 22), "#e23d4d"); tag(B.tEntry || "ENTRY", ye, "rgba(20,20,24,.92)"); }
      ctx.restore();
    });
    // candles
    const vis = st.p * n;
    for (let i = 0; i < Math.min(n, Math.ceil(vis)); i++) {
      const c = cs[i], f = Math.min(1, vis - i), up = c[3] >= c[0], x = X(i);
      const cl = c[0] + (c[3] - c[0]) * f, h = Math.max(c[0], cl, c[0] + (c[1] - c[0]) * f), l = Math.min(c[0], cl, c[0] + (c[2] - c[0]) * f);
      ctx.strokeStyle = up ? "#bdbdc6" : "#c86a12"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, Y(h)); ctx.lineTo(x, Y(l)); ctx.stroke();

    // arrows
    (spec.arrows || []).forEach((A, j) => { const a = st.arrows[j]; if (a <= 0) return; const x = X(A.i), y = Y(A.v) + (A.up ? 30 : -30) + (1 - Math.min(1, a)) * (A.up ? 40 : -40); ctx.save(); ctx.globalAlpha = Math.min(1, a); ctx.strokeStyle = A.up ? "#4f8dff" : "#ff4d5e"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 20; const d = A.up ? 1 : -1; ctx.beginPath(); ctx.moveTo(x, y + d * 46); ctx.lineTo(x, y); ctx.moveTo(x - 14, y + d * 16); ctx.lineTo(x, y); ctx.lineTo(x + 14, y + d * 16); ctx.stroke(); if (A.label) { ctx.font = "800 24px Inter"; ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.shadowBlur = 0; ctx.fillText(A.label, x, y + d * 74); } ctx.restore(); });
    ctx.restore();
  }
  draws.push(draw);
  return { st, cv, X, Y };
}
function roundRect(c, x, y, w, h, r) { r = Math.min(r, Math.abs(h) / 2, Math.abs(w) / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---------- scene builders
const B = {};
function words(at, p, node, text, cls) { // kinetic words: each word pops in
  const ws = text.split(" "); node.innerHTML = ws.map((w) => `<span style="display:inline-block;opacity:0">${w}&nbsp;</span>`).join("");
  [...node.children].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2)" }, at + i * (p || 0.07)));
}
B.hook = (sc, d, at) => {
  const c = chart(sc, d, sc.p.chart); tl.to(c.st, { p: 1, duration: sc.dur * 0.85, ease: "none" }, sc.start);
  (sc.p.chart.levels || []).forEach((_, j) => tl.to(c.st.levels, { [j]: 1, duration: 0.6, ease: "power2.out" }, sc.start + 0.1));
  tl.fromTo(c.st, { cam: 1.12 }, { cam: 1, duration: sc.dur, ease: "power1.out" }, sc.start);
  const t1 = el(`<div class="big l1" style="top:190px"></div>`, d), t2 = el(`<div class="big l2 or" style="top:250px"></div>`, d);
  words(sc.start + 0.05, 0.08, t1, sc.p.line1); words(at(sc.p.key2) || sc.start + 0.6, 0.1, t2, sc.p.line2);
  (sc.p.hits || []).forEach((k) => { const t = at(k); if (t) tl.fromTo(c.st, { shake: 0.01 }, { shake: 1, duration: 0.5 }, t); });
  (sc.p.chart.arrows || []).forEach((A, j) => tl.to(c.st.arrows, { [j]: 1, duration: 0.5, ease: "back.out(2)" }, at(A.cue) || sc.start + sc.dur * 0.5));
  (sc.p.chart.boxes || []).forEach((Bx, j) => tl.to(c.st.boxes, { [j]: 1, duration: 0.9, ease: "power3.out" }, at(Bx.cue) || sc.start + sc.dur * 0.5));
};
B.chart = (sc, d, at) => {
  const c = chart(sc, d, sc.p.chart);
  const pr = sc.p.reveal || [0, 0.9];
  tl.fromTo(c.st, { p: sc.p.chart.p0 || 0 }, { p: sc.p.chart.p1 || 1, duration: sc.dur * (pr[1] - pr[0]), ease: sc.p.ease || "none" }, sc.start + sc.dur * pr[0]);
  tl.fromTo(c.cv, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, sc.start);
  (sc.p.chart.levels || []).forEach((L, j) => tl.to(c.st.levels, { [j]: 1, duration: 0.9, ease: "power3.out" }, at(L.cue) || sc.start + 0.3));
  (sc.p.chart.boxes || []).forEach((Bx, j) => tl.to(c.st.boxes, { [j]: 1, duration: 0.9, ease: "power3.out" }, at(Bx.cue) || sc.start + sc.dur * 0.5));
  (sc.p.chart.arrows || []).forEach((A, j) => tl.to(c.st.arrows, { [j]: 1, duration: 0.5, ease: "back.out(2)" }, at(A.cue) || sc.start + sc.dur * 0.5));
  if (sc.p.chart.bubbles) tl.to(c.st, { bubbles: 1, duration: 1.4, ease: "none" }, at(sc.p.bubbleCue) || sc.start + sc.dur * 0.35);
  if (sc.p.title) { const t = el(`<div class="big l1" style="top:${sc.p.titleTop || 190}px;font-size:${sc.p.titleSize || 44}px"></div>`, d); words(sc.start + 0.1, 0.07, t, sc.p.title); }
  if (sc.p.badge) { const b = el(`<div class="pill ${sc.p.badge.cls || ""}" style="left:50%;top:${sc.p.badge.top || 1080}px;transform:translateX(-50%)"><i></i>${sc.p.badge.text}</div>`, d); tl.fromTo(b, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, at(sc.p.badge.cue) || sc.start + sc.dur * 0.4); }
  (sc.p.shake || []).forEach((k) => { const t = at(k); if (t) tl.fromTo(c.st, { shake: 0.01 }, { shake: 1, duration: 0.55 }, t); });
  tl.fromTo(c.st, { cam: 1.06 }, { cam: 1, duration: sc.dur, ease: "power1.out" }, sc.start);
};
B.dealer = (sc, d, at) => {
  const you = el(`<div class="pill w" style="left:70px;top:420px"><i></i>YOU · buy a call</div>`, d), dlr = el(`<div class="pill" style="right:60px;top:600px"><i></i>DEALER · sells it</div>`, d);
  const sp = el(`<div class="sphere" style="left:210px;top:760px;width:300px;height:300px"><b>Δ</b></div>`, d);
  [380, 520, 660].forEach((r, i) => { const g = el(`<div class="ring" style="left:${360 - r / 2}px;top:${910 - r / 2}px;width:${r}px;height:${r}px"></div>`, d); tl.fromTo(g, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: "power2.out" }, (at(sc.p.hedgeCue) || sc.start + 2) + i * 0.12); });
  const lab = el(`<div class="pill g" style="left:50%;top:1110px;transform:translateX(-50%)"><i></i>hedge: trade the stock</div>`, d);
  tl.fromTo(you, { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, sc.start + 0.15);
  tl.fromTo(dlr, { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, at(sc.p.dealerCue) || sc.start + 1);
  tl.fromTo(sp, { scale: 0.2, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, at(sc.p.hedgeCue) || sc.start + 2);
  tl.fromTo(lab, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, (at(sc.p.hedgeCue) || sc.start + 2) + 0.4);
  tl.to(sp, { rotation: 18, duration: sc.dur, ease: "none" }, sc.start + 1);
};
B.bars = (sc, d, at) => {
  const wrap = el(`<div style="position:absolute;left:60px;right:60px;top:430px;height:560px"></div>`, d);
  const vals = sc.p.vals, mx = Math.max(...vals);
  vals.forEach((v, i) => {
    const x = 18 + i * ((600 - 36) / vals.length), hot = v === mx;
    const b = el(`<div class="bar3d ${hot ? "hot" : ""}" style="left:${x}px;height:${(v / mx) * 520}px"></div>`, wrap);
    el(`<div class="blabel" style="left:${x}px">${sc.p.labels[i]}</div>`, wrap);
    tl.fromTo(b, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, sc.start + 0.3 + i * 0.06);
  });

  tl.to(fb, { background: "#ffa028", color: "#120a00", duration: 0.2 }, sc.start + 2.5);
};

// ---------- assemble
for (const sc of DATA.scenes) {
  const d = el(`<div class="scene" id="${sc.id}"></div>`);
  const at = (k) => (k && sc.cues && sc.cues[k] !== undefined ? sc.start + sc.cues[k] : null);
  tl.set(d, { visibility: "visible", opacity: 1 }, sc.start);
  tl.fromTo(d, { opacity: 0, scale: 1.04, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, sc.start);
  tl.to(d, { opacity: 0, scale: 0.97, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, sc.start + sc.dur - 0.3);
  tl.set(d, { visibility: "hidden" }, sc.start + sc.dur);
  if (sc.flash) tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, sc.start);
  B[sc.kind](sc, d, at);
}
tl.fromTo("#bg", { scale: 1 }, { scale: 1.12, rotation: 3, duration: DATA.total, ease: "none" }, 0);
tl.to({}, { duration: 0.01 }, DATA.total);
// caption: the spoken word, small, at the top (orange on emphasised words)
const cap = document.getElementById("cap");
function caption(t) { let w = null; for (const x of DATA.words) { if (x.s <= t && t < x.e) { w = x; break; } } cap.textContent = w ? w.w.replace(/[.,!?;:]+$/, "") : ""; cap.className = w && w.em ? "em" : ""; }
window.seek = (t) => { tl.seek(t, false); draws.forEach((f) => f()); caption(t); document.getElementById("grain").style.transform = `translate(${(t * 37) % 40 - 20}px, ${(t * 53) % 40 - 20}px)`; };
